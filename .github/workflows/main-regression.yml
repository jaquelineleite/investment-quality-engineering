name: Main Regression

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Main Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TEST_ENV: paper
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "::error::Missing ALPACA_API_KEY secret"
            exit 1
          fi

          if [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::Missing ALPACA_SECRET_KEY secret"
            exit 1
          fi

      - name: Run full Maven regression
        run: >
          mvn
          --batch-mode
          --no-transfer-progress
          clean
          test
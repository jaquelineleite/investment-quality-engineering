name: PR Quality Gate

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  api-quality-gate:

    runs-on: ubuntu-24.04

    env:
      TEST_ENV: paper
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Security gate - tracked secrets
        run: python3 scripts/security/security_gate.py

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "ALPACA_API_KEY is not configured."
            exit 1
          fi

          if [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "ALPACA_SECRET_KEY is not configured."
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Run API quality gate
        run: |
          mvn \
            -pl api-tests \
            -am \
            clean test
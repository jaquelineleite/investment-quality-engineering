name: Main Regression

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04

    env:
      TEST_ENV: paper
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      UI_BASE_URL: http://127.0.0.1:8081
      HEADLESS: "true"

      DB_URL: jdbc:postgresql://127.0.0.1:5433/investment_qe
      DB_USER: iqe_user
      DB_PASSWORD: iqe_password

      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: iqe_user
      RABBITMQ_PASSWORD: iqe_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Security gate - tracked secrets
        run: python3 scripts/security/security_gate.py
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$ALPACA_API_KEY" || exit 1
          test -n "$ALPACA_SECRET_KEY" || exit 1

      - name: Start controlled UI lab
        shell: bash
        run: |
          nohup python3 -m http.server 8081 \
            --directory ui-lab \
            > /tmp/ui-lab.log 2>&1 &

          for attempt in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8081/ \
              > /dev/null; then
              echo "UI lab is ready."
              exit 0
            fi

            echo "Waiting for UI lab... ${attempt}/15"
            sleep 1
          done

          cat /tmp/ui-lab.log || true
          exit 1

      - name: Start PostgreSQL test database
        shell: bash
        run: |
          docker compose \
            -f infrastructure/docker/postgres/docker-compose.yml \
            up -d

          for attempt in {1..30}; do

            STATUS=$(docker inspect \
              -f '{{.State.Health.Status}}' \
              investment-qe-postgres \
              2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL... ${attempt}/30"
            sleep 1
          done

          docker logs investment-qe-postgres || true
          exit 1


      - name: Start RabbitMQ test broker
        shell: bash
        run: |
          docker compose \
            -f infrastructure/docker/rabbitmq/docker-compose.yml \
            up -d

          for attempt in {1..30}; do

            STATUS=$(docker inspect \
              -f '{{.State.Health.Status}}' \
              investment-qe-rabbitmq \
              2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              echo "RabbitMQ is ready."
              exit 0
            fi

            echo "Waiting for RabbitMQ... ${attempt}/30"
            sleep 1
          done

          docker logs investment-qe-rabbitmq || true
          exit 1
      - name: Run API UI and database regression
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean test

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/ui-lab.log || true
          docker logs investment-qe-postgres || true

      - name: Stop RabbitMQ
        if: always()
        shell: bash
        run: |
          docker compose \
            -f infrastructure/docker/rabbitmq/docker-compose.yml \
            down -v
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: |
          docker compose \
            -f infrastructure/docker/postgres/docker-compose.yml \
            down -v
name: Nightly Regression

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04

    env:
      TEST_ENV: paper
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      UI_BASE_URL: http://127.0.0.1:8081
      HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"

      - name: Start controlled UI lab
        shell: bash
        run: |
          nohup python3 -m http.server 8081 \
            --directory ui-lab \
            > /tmp/ui-lab.log 2>&1 &

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 1 \
            http://127.0.0.1:8081/ \
            > /dev/null

      - name: Run nightly regression
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14